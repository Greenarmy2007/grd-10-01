<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2A3441" />
      <stop offset="60%" stop-color="#141E2B" />
      <stop offset="100%" stop-color="#0B1726" />
    </radialGradient>
    <filter id="archivalGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.8  0 0 0 0 0.8  0 0 0 0.07 0" />
      <feBlend mode="overlay" in="SourceGraphic" result="blend" />
    </filter>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A96A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E4C97E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C8A96A" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#vignette)" filter="url(#archivalGrain)" />

  <!-- Double Archival Border -->
  <rect x="25" y="25" width="550" height="700" stroke="url(#goldBorder)" stroke-width="1" fill="none" opacity="0.6" />
  <rect x="35" y="35" width="530" height="680" stroke="#C8A96A" stroke-width="0.5" stroke-dasharray="3 3" fill="none" opacity="0.35" />

  <!-- Decorative Corner Accents -->
  <path d="M 25 45 L 45 45 L 45 25" stroke="#C8A96A" stroke-width="1.5" fill="none" />
  <path d="M 575 45 L 555 45 L 555 25" stroke="#C8A96A" stroke-width="1.5" fill="none" />
  <path d="M 25 705 L 45 705 L 45 725" stroke="#C8A96A" stroke-width="1.5" fill="none" />
  <path d="M 575 705 L 555 705 L 555 725" stroke="#C8A96A" stroke-width="1.5" fill="none" />

  <!-- Silhouette / Archival Portrait Silhouette Representation -->
  <g transform="translate(150, 110)" opacity="0.85">
    <!-- Traditional shawl / bust contour in monochrome tones -->
    <ellipse cx="150" cy="360" rx="145" ry="110" fill="#1C2735" />
    <path d="M 60 410 C 70 330, 95 270, 150 270 C 205 270, 230 330, 240 410 Z" fill="#162230" />
    <!-- Neck & Head Contour -->
    <path d="M 120 270 L 120 225 C 120 220, 180 220, 180 225 L 180 270 Z" fill="#243142" />
    <ellipse cx="150" cy="180" rx="68" ry="85" fill="#2D3B4E" />
    <!-- Traditional Indian Pagadi / Headwear & Dignified Profile Silhouette -->
    <path d="M 78 170 C 75 110, 110 70, 150 70 C 190 70, 225 110, 222 170 C 215 160, 205 145, 150 145 C 95 145, 85 160, 78 170 Z" fill="#1A2533" />
    <!-- Shawl fold lines in subtle gold -->
    <path d="M 90 380 Q 150 320 210 395" stroke="#C8A96A" stroke-width="1" opacity="0.3" fill="none" />
    <path d="M 115 390 Q 150 345 185 410" stroke="#C8A96A" stroke-width="0.8" opacity="0.25" fill="none" />
    <!-- Radiance aura subtle line -->
    <circle cx="150" cy="180" r="115" stroke="#C8A96A" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.2" fill="none" />
  </g>

  <!-- Archival Seal Stamp -->
  <g transform="translate(300, 520)">
    <circle cx="0" cy="0" r="42" stroke="#C8A96A" stroke-width="1" opacity="0.5" fill="#0B1726" />
    <circle cx="0" cy="0" r="38" stroke="#C8A96A" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4" />
    <text x="0" y="-8" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="700" fill="#E4C97E" text-anchor="middle" letter-spacing="2">ARCHIVAL</text>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#C8A96A" text-anchor="middle" letter-spacing="2">PORTRAIT</text>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#F5F1E8" opacity="0.6" text-anchor="middle">COLLECTION</text>
  </g>

  <!-- Institutional Typography & Clear Archival Notice -->
  <text x="300" y="605" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#F5F1E8" text-anchor="middle" letter-spacing="2.5">SHRI GHANSHYAM DUBE</text>
  <text x="300" y="628" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#C8A96A" text-anchor="middle" letter-spacing="3.5">1938 – 2021 • PUBLIC SERVANT &amp; VISIONARY</text>
  
  <line x1="220" y1="645" x2="380" y2="645" stroke="#C8A96A" stroke-width="0.75" opacity="0.5" />
  
  <!-- Clearly marked placeholder disclaimer per prompt requirement -->
  <text x="300" y="668" font-family="'Inter', sans-serif" font-size="7.5" font-weight="400" fill="#F5F1E8" opacity="0.5" text-anchor="middle" letter-spacing="1.2">[ OFFICIAL ARCHIVAL PHOTOGRAPH PLACEHOLDER ]</text>
  <text x="300" y="684" font-family="'Inter', sans-serif" font-size="6.5" font-weight="400" fill="#F5F1E8" opacity="0.35" text-anchor="middle" letter-spacing="0.8">Replaceable via GRD-10 Institutional Archive Management System</text>
</svg>
