<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- GRD-10 Institutional Wordmark & Monogram -->
  <defs>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C97E" />
      <stop offset="50%" stop-color="#C8A96A" />
      <stop offset="100%" stop-color="#9E8144" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Shield / Pillar Mark -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" stroke="url(#goldShimmer)" stroke-width="1.2" fill="#0B1726" />
    <circle cx="30" cy="30" r="24" stroke="#C8A96A" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6" />
    <!-- Monogram letters GRD -->
    <text x="30" y="31" font-family="'Playfair Display', Georgia, serif" font-size="13" font-weight="700" fill="url(#goldShimmer)" text-anchor="middle" letter-spacing="1">GRD</text>
    <text x="30" y="44" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#E4C97E" text-anchor="middle" letter-spacing="2">X</text>
    <path d="M 18 16 L 42 16" stroke="#C8A96A" stroke-width="0.6" opacity="0.7" />
    <path d="M 22 47 L 38 47" stroke="#C8A96A" stroke-width="0.6" opacity="0.7" />
  </g>

  <!-- Typography -->
  <g transform="translate(82, 22)">
    <text x="0" y="16" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#F5F1E8" letter-spacing="2.5">GRD<tspan fill="#C8A96A">—</tspan>10</text>
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#C8A96A" letter-spacing="2.8" text-transform="uppercase">SHRI GHANSHYAM DUBE ACHIEVER AWARDS</text>
    <text x="0" y="44" font-family="'Inter', sans-serif" font-size="6.5" font-weight="400" fill="#F5F1E8" opacity="0.6" letter-spacing="1.2">A MedscapeIndia Legacy Initiative</text>
  </g>
</svg>
